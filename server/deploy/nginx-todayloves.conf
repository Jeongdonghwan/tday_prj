# /etc/nginx/sites-available/todayloves
# 구조: todayloves.com = 커뮤니티 웹(SPA 정적) + SEO 페이지(Flask 프록시)
#       api.todayloves.com = API 전용(Flask 전체 프록시)
# 설치 후 certbot --nginx -d todayloves.com -d www.todayloves.com -d api.todayloves.com 로 https 적용

# ---- API 서브도메인: Flask 전체 ----
server {
    listen 80;
    server_name api.todayloves.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # 업로드 8MB + 여유
    }
}

# ---- 메인 도메인: SPA + Flask SSR 경로 ----
server {
    listen 80;
    server_name todayloves.com www.todayloves.com;

    root /srv/todaylove/web;
    index index.html;

    # 업로드 이미지: nginx 직접 서빙
    location /uploads/ {
        alias /srv/todaylove/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 서버 렌더 페이지(SEO·심사·관리자·웹 카카오 콜백)는 Flask 로
    location ~ ^/(t($|/)|terms$|privacy$|p/|admin|sitemap\.xml$|robots\.txt$|static/|auth/kakao/|health$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 번들 캐시 (파일명에 해시 포함)
    location /_expo/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 파일 → 라우트별 html → index.html 폴백
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
