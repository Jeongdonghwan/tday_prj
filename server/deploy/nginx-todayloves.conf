# /etc/nginx/sites-available/todayloves  →  ln -s 로 sites-enabled 에 연결
# 역할: https 종단 + gunicorn 프록시 + 업로드 이미지 정적 서빙
# 최초엔 80 포트만 두고, certbot 이 443 블록을 자동 추가함 (DEPLOY.md 4단계)

server {
    listen 80;
    server_name todayloves.com www.todayloves.com;

    # 업로드 이미지: 디스크에서 nginx 가 직접 서빙 (Flask 경유 X)
    location /uploads/ {
        alias /srv/todaylove/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 웹 정적 산출물(expo export) — 나중에 웹 배포 시 사용 (WEB_DEPLOY.md)
    # location /app/ { alias /srv/todaylove/web/; try_files $uri /app/index.html; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # 업로드 8MB + 여유
    }
}
