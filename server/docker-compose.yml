# 로컬 개발용 MariaDB (운영 카페24 MariaDB 와 동일 엔진)
# 실행:  docker compose up -d
services:
  db:
    image: mariadb:10.11
    container_name: sseuljeon-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sseuljeon
      MARIADB_USER: sseuljeon
      MARIADB_PASSWORD: sseuljeon
      MARIADB_ROOT_PASSWORD: rootpw
    command:
      # 스펙 §8: 2GB 서버 가정 — buffer pool 보수적
      - --innodb-buffer-pool-size=256M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트에 이미 MariaDB(3306)가 떠 있을 수 있어 3307 로 노출 (충돌 회피)
      - "3307:3306"
    volumes:
      - sseuljeon_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sseuljeon_db:
