name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: sseuljeon_test
          MARIADB_USER: sseuljeon
          MARIADB_PASSWORD: sseuljeon
          MARIADB_ROOT_PASSWORD: rootpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://sseuljeon:sseuljeon@127.0.0.1:3306/sseuljeon_test
      TEST_DB_ROOT_URL: mysql+pymysql://root:rootpw@127.0.0.1:3306/
      FLASK_ENV: testing
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci
